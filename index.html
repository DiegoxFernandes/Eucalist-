<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const OR="#ea6c00";
const PO={Alta:0,Média:1,Baixa:2};
const PS={Alta:{badge:"#ea6c00",emoji:"🔴"},Média:{badge:"#f59e0b",emoji:"🟡"},Baixa:{badge:"#22c55e",emoji:"🟢"}};
const ALL_CATS=["Esmalte","Fundo","Prime","Resina","Solvente","Tinta","Verniz"];
const LS_VISIT="eucalist_visit_v1";
const LS_PERM="eucalist_perm_v1";

function loadVisit(){try{const s=localStorage.getItem(LS_VISIT);return s?JSON.parse(s):{qty:{},data:{},loja:"",extras:[],nextId:500};}catch{return{qty:{},data:{},loja:"",extras:[],nextId:500};}}
function saveVisit(s){try{localStorage.setItem(LS_VISIT,JSON.stringify(s));}catch{}}
function loadPerm(){try{const s=localStorage.getItem(LS_PERM);return s?JSON.parse(s):{overrides:{},deleted:[]};}catch{return{overrides:{},deleted:[]};}}
function savePerm(s){try{localStorage.setItem(LS_PERM,JSON.stringify(s));}catch{}}

function centsToDisplay(c){if(!c)return "";return (c/100).toFixed(2).replace(".",",");}
function fmtCents(c){if(!c)return "—";return "R$ "+(c/100).toFixed(2).replace(".",",");}

function PriceInput({value,onChange,placeholder}){
  return(
    <input type="text" inputMode="numeric"
      value={value?centsToDisplay(value):""}
      onChange={e=>{const raw=e.target.value.replace(/\D/g,"");onChange(parseInt(raw)||0);}}
      placeholder={placeholder||"0,00"}
      style={{flex:1,padding:"6px 8px",border:"1.5px solid "+(value?"#f59e0b":"#e2e8f0"),borderRadius:7,fontSize:15,fontWeight:value?"700":"400",color:"#1e293b",outline:"none",background:"#fff",textAlign:"right"}}
    />
  );
}

function App(){
  const sv=loadVisit();
  const pm=loadPerm();

  const [screen,setScreen]=useState("check");
  const [sumTab,setSumTab]=useState("ruptura");
  const [qty,setQty]=useState(sv.qty||{});
  const [data,setData]=useState(sv.data||{});
  const [loja,setLoja]=useState(sv.loja||"");
  const [extras,setExtras]=useState(sv.extras||[]);
  const [nextId,setNextId]=useState(sv.nextId||500);
  const [overrides,setOverrides]=useState(pm.overrides||{});
  const [deleted,setDeleted]=useState(pm.deleted||[]);
  const [search,setSearch]=useState("");
  const [catFilter,setCatFilter]=useState("Todas");
  const [showAdd,setShowAdd]=useState(false);
  const [newP,setNewP]=useState({name:"",cat:"Tinta",pri:"Alta"});
  const [editCatId,setEditCatId]=useState(null);
  const [editPriId,setEditPriId]=useState(null);
  const [editNameId,setEditNameId]=useState(null);
  const [editNameVal,setEditNameVal]=useState("");
  const [showDeleted,setShowDeleted]=useState(false);
  const [copied,setCopied]=useState(null);
  const [toast,setToast]=useState(false);

  // Auto-save visita
  useEffect(()=>{
    saveVisit({qty,data,loja,extras,nextId});
    setToast(true);const t=setTimeout(()=>setToast(false),1200);return()=>clearTimeout(t);
  },[qty,data,loja,extras,nextId]);

  // Auto-save permanente
  useEffect(()=>{savePerm({overrides,deleted});},[overrides,deleted]);

  const updData=(id,f,v)=>setData(d=>({...d,[id]:{...d[id],[f]:v}}));
  const setPermCat=(id,v)=>setOverrides(o=>({...o,[id]:{...o[id],cat:v}}));
  const setPermPri=(id,v)=>setOverrides(o=>({...o,[id]:{...o[id],pri:v}}));
  const setPermName=(id,v)=>setOverrides(o=>({...o,[id]:{...o[id],name:v}}));
  const deleteItem=(id)=>setDeleted(d=>[...d,id]);
  const restoreItem=(id)=>setDeleted(d=>d.filter(x=>x!==id));
  const mark=(id,v)=>setQty(q=>({...q,[id]:String(v)}));
  const unmark=(id)=>setQty(q=>{const n={...q};delete n[id];return n;});

  const applyOv=(p)=>({...p,
    name:overrides[p.id]?.name||p.name,
    cat:overrides[p.id]?.cat||p.cat,
    pri:overrides[p.id]?.pri||p.pri
  });

  const all=[
    ...window.BASE_PRODS.filter(p=>!deleted.includes(p.id)).map(applyOv),
    ...extras.filter(p=>!deleted.includes(p.id)).map(applyOv)
  ];
  const allBase=[...window.BASE_PRODS,...extras];

  const cats=["Todas",...[...new Set(all.map(p=>p.cat))].sort()];
  const filtered=all
    .filter(p=>catFilter==="Todas"||p.cat===catFilter)
    .filter(p=>!search||p.name.toLowerCase().includes(search.toLowerCase())||p.code.includes(search))
    .sort((a,b)=>PO[a.pri]-PO[b.pri]);
  const sorted=[...all].sort((a,b)=>PO[a.pri]-PO[b.pri]);

  const checked=all.filter(p=>qty[p.id]!=null&&qty[p.id]!=="").length;
  const prog=Math.round((checked/all.length)*100);
  const notFound=sorted.filter(p=>qty[p.id]!=null&&qty[p.id]!==""&&Number(qty[p.id])===0);
  const foundList=sorted.filter(p=>qty[p.id]!=null&&qty[p.id]!==""&&Number(qty[p.id])===1);
  const withPrice=sorted.filter(p=>data[p.id]?.atacado||data[p.id]?.varejo);
  const comEstoque=foundList.filter(p=>data[p.id]?.estoque);

  const d=new Date().toLocaleDateString("pt-BR");
  const fL=loja?` — ${loja}`:"";

  const msgRuptura=()=>{
    const L=[`🚨 *RUPTURAS — EUCALIST PDV${fL}*`,`📅 ${d}`,""];
    if(notFound.length){
      L.push(`❌ *${notFound.length} produto(s) NÃO encontrado(s):*`);
      notFound.forEach(p=>{
        const est=data[p.id]?.estoque;
        L.push(`  • [${p.code}] ${p.name} (${p.cat}) — ${p.pri}${est?` | Estoque: ${est} un.`:""}`);
      });
      L.push("");
    }
    if(comEstoque.length){
      L.push("📦 *Estoque registrado:*");
      comEstoque.forEach(p=>L.push(`  • ${p.name} — ${data[p.id].estoque} un.`));
      L.push("");
    }
    L.push(`✅ Encontrados: ${foundList.length}  |  ❌ Rupturas: ${notFound.length}  |  ⬜ Não verificados: ${all.length-checked}`);
    L.push("");L.push("Favor providenciar reposição. Obrigado!");
    return L.join("\n");
  };

  const msgPreco=()=>{
    if(!withPrice.length)return "Nenhum preço registrado.";
    const byCat={};
    withPrice.forEach(p=>{if(!byCat[p.cat])byCat[p.cat]=[];byCat[p.cat].push(p);});
    const L=[`💰 *PESQUISA DE PREÇOS — EUCALIST PDV${fL}*`,`📅 ${d}`,""];
    Object.entries(byCat).forEach(([c,prods])=>{
      L.push(`📦 *${c}*`);
      prods.forEach(p=>{
        const pd=data[p.id]||{};
        const parts=[pd.atacado?`Atacado: ${fmtCents(pd.atacado)}`:"",pd.varejo?`Varejo: ${fmtCents(pd.varejo)}`:""].filter(Boolean).join("  |  ");
        L.push(`  • ${p.name}\n    ${parts}`);
      });
      L.push("");
    });
    L.push(`📊 Itens pesquisados: ${withPrice.length}`);
    return L.join("\n");
  };

  const copy=(t)=>{navigator.clipboard.writeText(t==="ruptura"?msgRuptura():msgPreco());setCopied(t);setTimeout(()=>setCopied(null),2500);};
  const novaVisita=()=>{setQty({});setData({});setLoja("");setCopied(null);setScreen("check");saveVisit({qty:{},data:{},loja:"",extras,nextId});};

  const sInp={width:"100%",padding:"8px 10px",border:"1px solid #e2e8f0",borderRadius:8,fontSize:14,boxSizing:"border-box"};

  // ── CHECKLIST ──
  if(screen==="check") return(
    <div style={{background:"#f8fafc",minHeight:"100vh"}}>
      {toast&&<div style={{position:"fixed",top:10,right:10,background:"#22c55e",color:"#fff",borderRadius:8,padding:"4px 12px",fontSize:12,fontWeight:700,zIndex:99,boxShadow:"0 2px 8px rgba(0,0,0,.2)"}}>💾 Salvo</div>}

      {/* Header */}
      <div style={{background:`linear-gradient(135deg,${OR},#f97316)`,padding:"14px 14px 10px",color:"#fff",position:"sticky",top:0,zIndex:10,boxShadow:"0 2px 10px rgba(234,108,0,.35)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:34,height:34,background:"rgba(255,255,255,.22)",borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>📦</div>
            <div>
              <div style={{fontSize:10,opacity:.8,textTransform:"uppercase",letterSpacing:.8}}>Eucalist · {all.length} SKUs</div>
              <div style={{fontSize:16,fontWeight:800}}>Eucalist PDV</div>
            </div>
          </div>
          <button onClick={()=>setScreen("sum")} disabled={checked===0}
            style={{background:checked===0?"rgba(255,255,255,.15)":"#fff",color:checked===0?"rgba(255,255,255,.45)":OR,border:"none",borderRadius:10,padding:"7px 12px",fontWeight:800,fontSize:13,cursor:checked===0?"not-allowed":"pointer"}}>
            {checked>0?`Finalizar (${checked})`:"Finalizar"}
          </button>
        </div>
        <input value={loja} onChange={e=>setLoja(e.target.value)} placeholder="📍 Nome da loja / PDV (opcional)"
          style={{width:"100%",background:"rgba(255,255,255,.18)",border:"1px solid rgba(255,255,255,.35)",borderRadius:8,padding:"6px 10px",fontSize:13,color:"#fff",boxSizing:"border-box",marginBottom:7,outline:"none"}}/>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4,opacity:.9}}>
          <span>{checked} verificados · {notFound.length} rupturas · 💰{withPrice.length} preços</span><span>{prog}%</span>
        </div>
        <div style={{background:"rgba(255,255,255,.25)",borderRadius:99,height:5}}>
          <div style={{background:"#fff",borderRadius:99,height:5,width:`${prog}%`,transition:"width .3s"}}/>
        </div>
      </div>

      {/* Search + Cats */}
      <div style={{background:"#fff",padding:"10px 12px 0",borderBottom:"1px solid #f1f5f9",position:"sticky",top:112,zIndex:9}}>
        <input placeholder="🔍 Nome ou código..." value={search} onChange={e=>setSearch(e.target.value)} style={{...sInp,marginBottom:8,background:"#f8fafc"}}/>
        <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:10,scrollbarWidth:"none"}}>
          {cats.map(c=>(
            <button key={c} onClick={()=>setCatFilter(c)}
              style={{flexShrink:0,padding:"4px 12px",borderRadius:99,fontSize:12,fontWeight:600,border:"none",cursor:"pointer",background:catFilter===c?OR:"#f1f5f9",color:catFilter===c?"#fff":"#475569"}}>
              {c}
            </button>
          ))}
        </div>
      </div>

      {/* Lista */}
      <div style={{padding:"10px 12px 120px"}}>
        {["Alta","Média","Baixa"].map(pri=>{
          const grp=filtered.filter(p=>p.pri===pri);
          if(!grp.length)return null;
          const s=PS[pri];
          return(
            <div key={pri} style={{marginBottom:18}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <span style={{background:s.badge,color:"#fff",fontSize:11,fontWeight:700,padding:"3px 12px",borderRadius:99}}>{s.emoji} {pri}</span>
                <span style={{fontSize:11,color:"#94a3b8"}}>{grp.length} itens</span>
              </div>
              {grp.map(p=>{
                const v=qty[p.id]??"";
                const pd=data[p.id]||{};
                const st=v===""?"pending":Number(v)===0?"missing":"ok";
                const bc=st==="pending"?"#e2e8f0":st==="missing"?"#ef4444":"#22c55e";
                return(
                  <div key={p.id} style={{background:"#fff",border:`1.5px solid ${bc}`,borderRadius:12,padding:"11px 12px",marginBottom:8,boxShadow:"0 1px 3px rgba(0,0,0,.04)"}}>

                    {/* Nome editável */}
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                      <div style={{flex:1}}>
                        {editNameId===p.id?(
                          <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:4}}>
                            <input autoFocus value={editNameVal} onChange={e=>setEditNameVal(e.target.value)}
                              onBlur={()=>{if(editNameVal.trim())setPermName(p.id,editNameVal.trim());setEditNameId(null);}}
                              onKeyDown={e=>{if(e.key==="Enter"){if(editNameVal.trim())setPermName(p.id,editNameVal.trim());setEditNameId(null);}if(e.key==="Escape")setEditNameId(null);}}
                              style={{flex:1,padding:"4px 8px",border:"1.5px solid #f59e0b",borderRadius:7,fontSize:14,fontWeight:600,color:"#1e293b",outline:"none"}}/>
                            <button onMouseDown={e=>{e.preventDefault();if(editNameVal.trim())setPermName(p.id,editNameVal.trim());setEditNameId(null);}}
                              style={{background:"#22c55e",border:"none",borderRadius:7,padding:"5px 10px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13}}>✓</button>
                          </div>
                        ):(
                          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                            <div style={{fontWeight:600,fontSize:14,color:"#1e293b",lineHeight:1.3,flex:1}}>{p.name}</div>
                            <button onClick={()=>{setEditNameId(p.id);setEditNameVal(p.name);setEditCatId(null);setEditPriId(null);}}
                              style={{background:"#f1f5f9",border:"1px solid #e2e8f0",borderRadius:6,padding:"2px 7px",fontSize:11,color:"#64748b",cursor:"pointer",flexShrink:0}}>✎</button>
                          </div>
                        )}

                        {/* Badges cat + pri */}
                        <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center",marginTop:2}}>
                          <span style={{fontSize:11,color:"#94a3b8"}}>{p.code}</span>

                          {editCatId===p.id?(
                            <select value={overrides[p.id]?.cat||p.cat}
                              onChange={e=>{setPermCat(p.id,e.target.value);setEditCatId(null);}}
                              style={{fontSize:11,border:"1px solid #fed7aa",borderRadius:6,padding:"2px 6px",background:"#fffbeb",color:OR,cursor:"pointer"}}
                              autoFocus onBlur={()=>setEditCatId(null)}>
                              {ALL_CATS.map(c=><option key={c}>{c}</option>)}
                            </select>
                          ):(
                            <button onClick={()=>{setEditCatId(p.id);setEditPriId(null);setEditNameId(null);}}
                              style={{background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:6,padding:"2px 8px",fontSize:11,color:OR,cursor:"pointer",fontWeight:600}}>
                              {overrides[p.id]?.cat||p.cat} ✎
                            </button>
                          )}

                          {editPriId===p.id?(
                            <select value={overrides[p.id]?.pri||p.pri}
                              onChange={e=>{setPermPri(p.id,e.target.value);setEditPriId(null);}}
                              style={{fontSize:11,border:`1px solid ${PS[overrides[p.id]?.pri||p.pri]?.badge}`,borderRadius:6,padding:"2px 6px",background:"#f8fafc",color:PS[overrides[p.id]?.pri||p.pri]?.badge,cursor:"pointer",fontWeight:700}}
                              autoFocus onBlur={()=>setEditPriId(null)}>
                              <option>Alta</option><option>Média</option><option>Baixa</option>
                            </select>
                          ):(
                            <button onClick={()=>{setEditPriId(p.id);setEditCatId(null);setEditNameId(null);}}
                              style={{background:PS[overrides[p.id]?.pri||p.pri]?.badge+"22",border:`1px solid ${PS[overrides[p.id]?.pri||p.pri]?.badge}`,borderRadius:6,padding:"2px 8px",fontSize:11,color:PS[overrides[p.id]?.pri||p.pri]?.badge,cursor:"pointer",fontWeight:700}}>
                              {PS[overrides[p.id]?.pri||p.pri]?.emoji} {overrides[p.id]?.pri||p.pri} ✎
                            </button>
                          )}
                        </div>
                      </div>

                      <div style={{display:"flex",gap:5,flexShrink:0}}>
                        {st!=="pending"&&<button onClick={()=>unmark(p.id)} style={{background:"#f1f5f9",border:"none",borderRadius:8,padding:"4px 8px",fontSize:12,color:"#94a3b8",cursor:"pointer"}}>↩</button>}
                        <button onClick={()=>{if(window.confirm('Remover "'+p.name+'" permanentemente?'))deleteItem(p.id);}}
                          style={{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:8,padding:"4px 8px",fontSize:13,color:"#ef4444",cursor:"pointer"}}>🗑</button>
                      </div>
                    </div>

                    {/* Botões status */}
                    <div style={{marginTop:9,display:"flex",gap:8}}>
                      <button onClick={()=>mark(p.id,0)} style={{flex:1,padding:"9px 0",borderRadius:10,border:"none",fontWeight:700,fontSize:13,cursor:"pointer",background:st==="missing"?"#ef4444":"#fef2f2",color:st==="missing"?"#fff":"#ef4444"}}>❌ Não encontrado</button>
                      <button onClick={()=>mark(p.id,1)} style={{flex:1,padding:"9px 0",borderRadius:10,border:"none",fontWeight:700,fontSize:13,cursor:"pointer",background:st==="ok"?"#22c55e":"#f0fdf4",color:st==="ok"?"#fff":"#22c55e"}}>✅ Encontrado</button>
                    </div>

                    {/* Preços + estoque */}
                    <div style={{marginTop:8,background:"#fffbeb",borderRadius:10,padding:"9px 10px",display:"flex",flexDirection:"column",gap:7}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{fontSize:12,color:"#92400e",fontWeight:700,width:72,flexShrink:0}}>🏭 Atacado</span>
                        <span style={{fontSize:12,color:"#92400e",fontWeight:700}}>R$</span>
                        <PriceInput value={pd.atacado||0} onChange={v=>updData(p.id,"atacado",v)}/>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{fontSize:12,color:"#92400e",fontWeight:700,width:72,flexShrink:0}}>🛒 Varejo</span>
                        <span style={{fontSize:12,color:"#92400e",fontWeight:700}}>R$</span>
                        <PriceInput value={pd.varejo||0} onChange={v=>updData(p.id,"varejo",v)}/>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{fontSize:12,color:"#92400e",fontWeight:700,width:72,flexShrink:0}}>📦 Estoque</span>
                        <input type="number" min="0" inputMode="numeric" value={pd.estoque||""} onChange={e=>updData(p.id,"estoque",e.target.value)} placeholder="qtd."
                          style={{flex:1,padding:"6px 8px",border:"1.5px solid "+(pd.estoque?"#86efac":"#e2e8f0"),borderRadius:7,fontSize:14,color:"#1e293b",outline:"none",background:"#fff",textAlign:"right",fontWeight:pd.estoque?"700":"400"}}/>
                        <span style={{fontSize:12,color:"#92400e"}}>un.</span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })}

        {/* Produtos removidos */}
        {deleted.length>0&&(
          <div style={{marginBottom:14}}>
            <button onClick={()=>setShowDeleted(v=>!v)}
              style={{width:"100%",background:"#f1f5f9",border:"1px solid #e2e8f0",borderRadius:10,padding:"9px 14px",fontSize:13,color:"#64748b",cursor:"pointer",fontWeight:600,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span>🗑 Produtos removidos ({deleted.length})</span>
              <span>{showDeleted?"▲":"▼"}</span>
            </button>
            {showDeleted&&(
              <div style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderTop:"none",borderRadius:"0 0 10px 10px",padding:"8px 10px"}}>
                {allBase.filter(p=>deleted.includes(p.id)).map(p=>(
                  <div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 4px",borderBottom:"1px solid #f1f5f9"}}>
                    <div>
                      <div style={{fontSize:13,fontWeight:600,color:"#94a3b8",textDecoration:"line-through"}}>{overrides[p.id]?.name||p.name}</div>
                      <div style={{fontSize:11,color:"#cbd5e1"}}>{p.code} · {overrides[p.id]?.cat||p.cat}</div>
                    </div>
                    <button onClick={()=>restoreItem(p.id)}
                      style={{background:"#f0fdf4",border:"1px solid #86efac",borderRadius:8,padding:"6px 12px",fontSize:12,color:"#16a34a",cursor:"pointer",fontWeight:700,flexShrink:0}}>
                      ↩ Restaurar
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* Adicionar produto */}
        {showAdd?(
          <div style={{background:"#fff",border:"1.5px dashed #fed7aa",borderRadius:12,padding:14,marginBottom:12}}>
            <div style={{fontWeight:600,marginBottom:10,color:OR}}>➕ Produto Extra</div>
            <div style={{marginBottom:8}}>
              <label style={{fontSize:12,color:"#475569",display:"block",marginBottom:3}}>Nome</label>
              <input value={newP.name} onChange={e=>setNewP(n=>({...n,name:e.target.value}))} style={sInp}/>
            </div>
            <div style={{marginBottom:8}}>
              <label style={{fontSize:12,color:"#475569",display:"block",marginBottom:3}}>Categoria</label>
              <select value={newP.cat} onChange={e=>setNewP(n=>({...n,cat:e.target.value}))} style={sInp}>
                {ALL_CATS.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div style={{marginBottom:10}}>
              <label style={{fontSize:12,color:"#475569",display:"block",marginBottom:3}}>Prioridade</label>
              <select value={newP.pri} onChange={e=>setNewP(n=>({...n,pri:e.target.value}))} style={sInp}>
                <option>Alta</option><option>Média</option><option>Baixa</option>
              </select>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>{if(!newP.name.trim())return;setExtras(ex=>[...ex,{...newP,id:nextId,code:"EXTRA"}]);setNextId(n=>n+1);setNewP({name:"",cat:"Tinta",pri:"Alta"});setShowAdd(false);}}
                style={{flex:1,background:OR,color:"#fff",border:"none",borderRadius:8,padding:"10px 0",fontWeight:700,cursor:"pointer"}}>Adicionar</button>
              <button onClick={()=>setShowAdd(false)}
                style={{flex:1,background:"#f1f5f9",color:"#475569",border:"none",borderRadius:8,padding:"10px 0",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            </div>
          </div>
        ):(
          <button onClick={()=>setShowAdd(true)}
            style={{width:"100%",background:"#fff",color:OR,border:"1.5px dashed #fed7aa",borderRadius:12,padding:"12px 0",fontWeight:600,fontSize:14,cursor:"pointer"}}>
            ➕ Produto extra
          </button>
        )}
      </div>

      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#fff",padding:"10px 14px 20px",borderTop:"1px solid #f1f5f9",boxShadow:"0 -4px 12px rgba(0,0,0,.06)"}}>
        <button onClick={()=>setScreen("sum")} disabled={checked===0}
          style={{width:"100%",background:checked===0?"#e2e8f0":`linear-gradient(135deg,${OR},#f97316)`,color:checked===0?"#94a3b8":"#fff",border:"none",borderRadius:12,padding:"14px 0",fontWeight:800,fontSize:16,cursor:checked===0?"not-allowed":"pointer",boxShadow:checked===0?"none":"0 4px 14px rgba(234,108,0,.4)"}}>
          {checked===0?"Marque ao menos um produto":`✅ Finalizar visita · ${checked}/${all.length}`}
        </button>
      </div>
    </div>
  );

  // ── RESUMO ──
  return(
    <div style={{background:"#f8fafc",minHeight:"100vh"}}>
      <div style={{background:`linear-gradient(135deg,${OR},#f97316)`,padding:"14px 14px 0",color:"#fff",boxShadow:"0 2px 10px rgba(234,108,0,.3)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
          <button onClick={()=>setScreen("check")}
            style={{background:"rgba(255,255,255,.2)",border:"none",color:"#fff",borderRadius:8,padding:"6px 10px",fontSize:14,cursor:"pointer"}}>← Voltar</button>
          <div>
            <div style={{fontSize:10,opacity:.8,textTransform:"uppercase",letterSpacing:.8}}>Eucalist PDV{loja?` · ${loja}`:""} · {d}</div>
            <div style={{fontSize:16,fontWeight:800}}>Resumo da Visita</div>
          </div>
        </div>
        <div style={{display:"flex"}}>
          {[{k:"ruptura",label:"🚨 Rupturas",n:notFound.length},{k:"preco",label:"💰 Preços",n:withPrice.length}].map(t=>(
            <button key={t.k} onClick={()=>setSumTab(t.k)}
              style={{flex:1,padding:"10px 0",border:"none",cursor:"pointer",fontWeight:700,fontSize:14,
                borderBottom:sumTab===t.k?"3px solid #fff":"3px solid transparent",background:"transparent",
                color:sumTab===t.k?"#fff":"rgba(255,255,255,.55)"}}>
              {t.label} {t.n>0&&<span style={{background:"rgba(255,255,255,.25)",borderRadius:99,padding:"1px 7px",fontSize:12}}>{t.n}</span>}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:"14px 12px 90px"}}>
        {/* Cards */}
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          {[{l:"Encontrados",v:foundList.length,c:"#22c55e",bg:"#f0fdf4"},{l:"Rupturas",v:notFound.length,c:"#ef4444",bg:"#fef2f2"},{l:"Preços coletados",v:withPrice.length,c:"#f59e0b",bg:"#fffbeb"}].map(s=>(
            <div key={s.l} style={{flex:1,background:s.bg,border:`1.5px solid ${s.c}`,borderRadius:12,padding:"10px 4px",textAlign:"center"}}>
              <div style={{fontSize:22,fontWeight:800,color:s.c}}>{s.v}</div>
              <div style={{fontSize:10,color:"#475569",fontWeight:600,lineHeight:1.3}}>{s.l}</div>
            </div>
          ))}
        </div>

        {/* Tab Rupturas */}
        {sumTab==="ruptura"&&(
          <>
            {notFound.length===0?(
              <div style={{background:"#f0fdf4",border:"1.5px solid #86efac",borderRadius:12,padding:20,textAlign:"center",marginBottom:14}}>
                <div style={{fontSize:32,marginBottom:6}}>🎉</div>
                <div style={{fontWeight:700,color:"#166534",fontSize:15}}>Nenhuma ruptura!</div>
              </div>
            ):(
              <div style={{marginBottom:14}}>
                <div style={{fontWeight:700,color:"#ef4444",marginBottom:8,fontSize:15}}>❌ Não encontrados</div>
                {notFound.map(p=>(
                  <div key={p.id} style={{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:10,padding:"10px 12px",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontWeight:600,fontSize:14}}>{p.name}</div>
                      <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>{p.code} · {p.cat}</div>
                      {data[p.id]?.estoque&&<div style={{fontSize:12,color:"#2563eb",fontWeight:600,marginTop:3}}>📦 Estoque: {data[p.id].estoque} un.</div>}
                    </div>
                    <span style={{background:PS[p.pri]?.badge,color:"#fff",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:99,flexShrink:0}}>{p.pri}</span>
                  </div>
                ))}
              </div>
            )}

            {comEstoque.length>0&&(
              <div style={{marginBottom:14}}>
                <div style={{fontWeight:700,color:"#2563eb",marginBottom:8,fontSize:15}}>📦 Estoque registrado</div>
                {comEstoque.map(p=>(
                  <div key={p.id} style={{background:"#eff6ff",border:"1px solid #93c5fd",borderRadius:10,padding:"10px 12px",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontWeight:600,fontSize:14}}>{p.name}</div>
                      <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>{p.code} · {p.cat}</div>
                    </div>
                    <span style={{background:"#2563eb",color:"#fff",fontSize:13,fontWeight:800,padding:"4px 12px",borderRadius:99}}>{data[p.id].estoque} un.</span>
                  </div>
                ))}
              </div>
            )}

            <div style={{background:"#fef2f2",border:"1.5px solid #fca5a5",borderRadius:12,padding:14,marginBottom:14}}>
              <div style={{fontWeight:700,color:"#dc2626",marginBottom:8}}>📋 Mensagem de Rupturas</div>
              <pre style={{fontSize:11,color:"#1e293b",whiteSpace:"pre-wrap",fontFamily:"system-ui",lineHeight:1.6,margin:0}}>{msgRuptura()}</pre>
            </div>
            <button onClick={()=>copy("ruptura")}
              style={{width:"100%",background:copied==="ruptura"?"#22c55e":"#dc2626",color:"#fff",border:"none",borderRadius:12,padding:"13px 0",fontWeight:700,fontSize:15,cursor:"pointer",marginBottom:10,transition:"background .3s"}}>
              {copied==="ruptura"?"✅ Copiado!":"📋 Copiar relatório de rupturas"}
            </button>
          </>
        )}

        {/* Tab Preços */}
        {sumTab==="preco"&&(
          <>
            {withPrice.length===0?(
              <div style={{background:"#fffbeb",border:"1.5px solid #fde68a",borderRadius:12,padding:20,textAlign:"center",marginBottom:14}}>
                <div style={{fontSize:32,marginBottom:6}}>💰</div>
                <div style={{fontWeight:700,color:"#92400e",fontSize:15}}>Nenhum preço registrado</div>
                <button onClick={()=>setScreen("check")} style={{marginTop:12,background:OR,color:"#fff",border:"none",borderRadius:10,padding:"9px 20px",fontWeight:700,fontSize:14,cursor:"pointer"}}>← Voltar</button>
              </div>
            ):(
              <>
                {[...new Set(withPrice.map(p=>p.cat))].map(c=>{
                  const grp=withPrice.filter(p=>p.cat===c);
                  return(
                    <div key={c} style={{marginBottom:14}}>
                      <div style={{fontWeight:700,color:"#92400e",marginBottom:8,fontSize:14}}>📦 {c}</div>
                      {grp.map(p=>{
                        const pd=data[p.id]||{};
                        return(
                          <div key={p.id} style={{background:"#fff",border:"1px solid #fde68a",borderRadius:10,padding:"10px 12px",marginBottom:6}}>
                            <div style={{fontWeight:600,fontSize:13,marginBottom:6}}>{p.name}</div>
                            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                              {pd.atacado?<span style={{background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:8,padding:"4px 10px",fontSize:13,fontWeight:700,color:OR}}>🏭 {fmtCents(pd.atacado)}</span>:null}
                              {pd.varejo?<span style={{background:"#f0fdf4",border:"1px solid #86efac",borderRadius:8,padding:"4px 10px",fontSize:13,fontWeight:700,color:"#16a34a"}}>🛒 {fmtCents(pd.varejo)}</span>:null}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
                <div style={{background:"#fffbeb",border:"1.5px solid #fde68a",borderRadius:12,padding:14,marginBottom:14}}>
                  <div style={{fontWeight:700,color:"#92400e",marginBottom:8}}>📋 Mensagem de Preços</div>
                  <pre style={{fontSize:11,color:"#1e293b",whiteSpace:"pre-wrap",fontFamily:"system-ui",lineHeight:1.6,margin:0}}>{msgPreco()}</pre>
                </div>
                <button onClick={()=>copy("preco")}
                  style={{width:"100%",background:copied==="preco"?"#22c55e":OR,color:"#fff",border:"none",borderRadius:12,padding:"13px 0",fontWeight:700,fontSize:15,cursor:"pointer",marginBottom:10,transition:"background .3s"}}>
                  {copied==="preco"?"✅ Copiado!":"📋 Copiar pesquisa de preços"}
                </button>
              </>
            )}
          </>
        )}

        <button onClick={novaVisita}
          style={{width:"100%",background:"#f1f5f9",color:"#475569",border:"none",borderRadius:12,padding:"11px 0",fontWeight:600,fontSize:14,cursor:"pointer"}}>
          🔄 Nova visita
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
